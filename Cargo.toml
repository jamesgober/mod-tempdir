[package]
name = "mod-tempdir"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Temporary directory and file management for Rust. Auto-cleanup on Drop, exclusive creation with private permissions, unpredictable OS-random names, orphan cleanup, cross-platform paths. Zero runtime deps by default. tempfile replacement at MSRV 1.75."

keywords = [
    "tempfile",
    "tempdir",
    "temporary",
    "filesystem",
    "raii"
]

categories = [
    "filesystem",
    "development-tools::testing"
]

documentation = "https://docs.rs/mod-tempdir"
repository = "https://github.com/jamesgober/mod-tempdir"
homepage = "https://github.com/jamesgober/mod-tempdir"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
mod-rand = { version = "1.0", optional = true, default-features = false, features = ["tier3"] }

[dev-dependencies]

[features]
default = []
# Draw names straight from `mod_rand::tier3` (the OS random source) on
# every call. The default build already uses OS randomness through std;
# this feature only changes the path. Adds one optional dependency
# (`mod-rand`, zero further transitive deps).
mod-rand = ["dep:mod-rand"]

[profile.release]
opt-level = 3
lto = "thin"
